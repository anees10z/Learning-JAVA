<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Text to Message Box</title>
    <style>
      #message {
        border: 1px solid #999;
        padding: 12px;
        width: 250px;
        min-height: 20px;
        background-color: #f5f5f5;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Button Text to Message Box</h1>
    <p id="message"></p>
    <hr />
    <button id="btn1">RED</button>
    <button id="btn2">BLUE</button>
    <button id="btn3">GREEN</button>
    <script>
      //   const buttons = document.querySelectorAll ("button");
      
      const message = document.getElementById("message");
      document.body.addEventListener("click", (e) => {
        if (e.target.tagName === "BUTTON") {
          message.textContent = e.target.textContent;
        }
      });

      //   buttons.forEach (button => {
      //       button.addEventListener("click", () => {
      //           message.textContent = button.textContent;
      //       });
      //   });
    </script>
  </body>
</html>
